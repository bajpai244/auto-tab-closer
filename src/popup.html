<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auto Tab Closer</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="brand">
        <img src="../icons/icon48.png" alt="" class="brand-logo" width="26" height="26">
        <div class="brand-copy">
          <h1>Auto Tab Closer</h1>
          <p class="subtitle-row">
            <span id="statusDot" class="status-dot" aria-hidden="true"></span>
            <span id="statusSubtitle" class="subtitle">Loading...</span>
          </p>
        </div>
      </div>
      <div class="header-controls">
        <button
          type="button"
          id="themeToggleBtn"
          class="icon-btn"
          aria-label="Toggle light or dark theme"
          title="Switch theme"
        >
          <svg class="icon-sun" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
          </svg>
          <svg class="icon-moon" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        </button>
        <label class="switch" title="Enable or pause auto-closing">
          <input type="checkbox" id="enabledToggle" aria-label="Enable Auto Tab Closer">
          <span class="slider"></span>
        </label>
      </div>
    </header>

    <nav class="tabs-nav" role="tablist">
      <button type="button" class="tab-btn active" data-tab="timer" role="tab" aria-selected="true">
        Timer
      </button>
      <button type="button" class="tab-btn" data-tab="open" role="tab" aria-selected="false">
        Tabs <span id="openCountBadge" class="tab-count">0</span>
      </button>
      <button type="button" class="tab-btn" data-tab="closed" role="tab" aria-selected="false">
        Closed <span id="closedCountBadge" class="tab-count">0</span>
      </button>
    </nav>

    <main class="content">
      <!-- Timer & Settings Panel -->
      <section id="panel-timer" class="panel active" role="tabpanel">
        <div class="hero-timer">
          <form id="timeoutForm" class="hero-form" novalidate>
            <div class="hero-input-wrap">
              <input
                type="number"
                id="timeoutInput"
                min="1"
                max="43200"
                step="1"
                value="120"
                required
                aria-label="Inactivity duration in minutes"
              >
              <span class="hero-unit">min</span>
            </div>
            <button type="submit" id="saveTimeoutBtn" class="btn-save" hidden>Save</button>
          </form>

          <p id="timeoutFormatted" class="hero-caption">Closes inactive tabs after 2h</p>
          <div id="timeoutError" class="error-text" hidden></div>

          <div class="presets" aria-label="Quick presets">
            <button type="button" class="preset-chip" data-minutes="15">15m</button>
            <button type="button" class="preset-chip" data-minutes="30">30m</button>
            <button type="button" class="preset-chip" data-minutes="60">1h</button>
            <button type="button" class="preset-chip" data-minutes="120">2h</button>
            <button type="button" class="preset-chip" data-minutes="240">4h</button>
            <button type="button" class="preset-chip" data-minutes="480">8h</button>
          </div>
        </div>

        <div class="divider"></div>

        <div class="section">
          <div class="section-heading">Keep open</div>
          <div class="rule-list">
            <label class="rule-row">
              <span class="rule-label">Pinned tabs</span>
              <span class="switch switch-sm">
                <input type="checkbox" id="protectPinnedToggle">
                <span class="slider"></span>
              </span>
            </label>
            <label class="rule-row">
              <span class="rule-label">Tabs playing audio</span>
              <span class="switch switch-sm">
                <input type="checkbox" id="protectAudibleToggle">
                <span class="slider"></span>
              </span>
            </label>
            <label class="rule-row">
              <div class="rule-copy">
                <span class="rule-label">Active tab in background windows</span>
                <span class="rule-sub">Off closes idle app &amp; PWA windows</span>
              </div>
              <span class="switch switch-sm">
                <input type="checkbox" id="protectBgActiveToggle">
                <span class="slider"></span>
              </span>
            </label>
          </div>
        </div>

        <div class="divider"></div>

        <details id="excludeDetails" class="section exclusions">
          <summary class="exclusions-summary">
            <span class="exclusions-title">
              Excluded sites <span id="excludedCount" class="muted-count">0</span>
            </span>
            <span class="exclusions-right">
              <button type="button" id="excludeCurrentBtn" class="text-action" hidden>
                + current
              </button>
              <span class="chevron" aria-hidden="true"></span>
            </span>
          </summary>

          <div class="exclusions-body">
            <form id="excludeForm" class="exclude-form">
              <input
                type="text"
                id="excludeInput"
                placeholder="Add domain, e.g. mail.google.com"
                autocomplete="off"
                aria-label="Domain to exclude"
              >
              <button type="submit" class="text-action strong">Add</button>
            </form>
            <div id="excludeError" class="error-text" hidden></div>
            <ul id="excludedList" class="domain-list"></ul>
            <p id="excludedEmpty" class="quiet-note">No excluded sites.</p>
          </div>
        </details>

        <footer class="footer-bar">
          <span id="totalClosedStat" class="stat-text">0 closed</span>
          <button type="button" id="sweepNowBtn" class="text-action">Sweep now</button>
        </footer>
      </section>

      <!-- Open Tabs Panel -->
      <section id="panel-open" class="panel" role="tabpanel" hidden>
        <div id="openTabsList" class="item-list"></div>
        <div id="openTabsEmpty" class="empty-state" hidden>No open tabs.</div>
      </section>

      <!-- Recently Closed Panel -->
      <section id="panel-closed" class="panel" role="tabpanel" hidden>
        <div class="panel-toolbar" id="closedToolbar" hidden>
          <span class="toolbar-label">Recently closed</span>
          <button type="button" id="clearHistoryBtn" class="text-action danger">Clear</button>
        </div>
        <div id="closedHistoryList" class="item-list"></div>
        <div id="closedHistoryEmpty" class="empty-state">
          Stillness. No tabs closed yet.
        </div>
      </section>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
